<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Realistic City Racer</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    text-shadow:
        0 2px 5px rgba(0,0,0,.9);
}

#title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:21px;
    font-weight:900;
    letter-spacing:6px;
}

#speed{
    position:absolute;
    left:25px;
    bottom:28px;
    font-size:34px;
    font-weight:900;
}

#speed small{
    font-size:13px;
    opacity:.8;
}

#nitroText{
    position:absolute;
    left:25px;
    bottom:103px;
    font-size:11px;
    font-weight:bold;
}

#nitroBox{
    position:absolute;
    left:25px;
    bottom:82px;
    width:245px;
    height:16px;
    border:2px solid white;
    border-radius:12px;
    overflow:hidden;
    background:rgba(0,0,0,.45);
}

#nitro{
    width:100%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #00c8ff,
            #087cff,
            #9b00ff
        );

    box-shadow:
        0 0 18px #00c8ff;
}

#controls{
    position:absolute;
    right:22px;
    bottom:20px;
    text-align:right;
    line-height:1.7;
    font-size:13px;
}

#crash{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.2),
            rgba(0,0,0,.65)
        );

    opacity:0;
    pointer-events:none;
    transition:.15s;
}

#crash h1{
    margin:0;
    color:white;
    font-size:70px;
    font-weight:900;
    letter-spacing:8px;
}

#crash p{
    color:white;
    font-size:18px;
}

#loading{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        linear-gradient(
            #65bce8,
            #dff6ff
        );

    color:white;
}

#loading h1{
    font-size:42px;
    letter-spacing:5px;
}

#bar{
    width:300px;
    height:8px;
    background:rgba(0,0,0,.3);
    border-radius:10px;
    overflow:hidden;
}

#barInner{
    width:0%;
    height:100%;
    background:white;
    transition:.2s;
}

</style>
</head>

<body>

<div id="loading">

    <h1>CITY RACER</h1>

    <p id="loadingText">
        Loading realistic cars...
    </p>

    <div id="bar">
        <div id="barInner"></div>
    </div>

</div>

<canvas id="game"></canvas>

<div id="hud">

    <div id="title">
        CITY RACER
    </div>

    <div id="speed">
        0 <small>KM/H</small>
    </div>

    <div id="nitroText">
        NITRO
    </div>

    <div id="nitroBox">
        <div id="nitro"></div>
    </div>

    <div id="controls">

        ↑ / W — ACCELERATE<br>
        ↓ / S — BRAKE<br>
        ← / A — LEFT<br>
        → / D — RIGHT<br>
        SPACE — DRIFT<br>
        SHIFT — NITRO<br>
        R — RESTART

    </div>

</div>

<div id="crash">

    <h1>CRASH</h1>

    <p>
        Vehicle collision detected — restarting...
    </p>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const CAR_MODEL =
"https://threejs.org/examples/models/gltf/ferrari.glb";


/* =====================================================
   SCENE
===================================================== */

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
    0x91d7ff
);

scene.fog =
new THREE.Fog(
    0x91d7ff,
    130,
    500
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
    63,
    innerWidth / innerHeight,
    .1,
    900
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.25;


/* =====================================================
   LIGHTING
===================================================== */

const hemisphere =
new THREE.HemisphereLight(
    0xcceeff,
    0x4e6049,
    2.5
);

scene.add(
    hemisphere
);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    4.5
);

sun.position.set(
    -120,
    180,
    -100
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;

sun.shadow.camera.near=1;
sun.shadow.camera.far=500;

scene.add(
    sun
);


/* =====================================================
   WORLD
===================================================== */

const world =
new THREE.Group();

scene.add(
    world
);


/* =====================================================
   MATERIALS
===================================================== */

const roadMaterial =
new THREE.MeshStandardMaterial({
    color:0x25282c,
    roughness:.9,
    metalness:.05
});


const sidewalkMaterial =
new THREE.MeshStandardMaterial({
    color:0xaeb1ae,
    roughness:.85
});


const grassMaterial =
new THREE.MeshStandardMaterial({
    color:0x4f9847,
    roughness:1
});


const whiteMaterial =
new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:.5
});


/* =====================================================
   BOX
===================================================== */

function createBox(
    width,
    height,
    depth,
    material,
    x,
    y,
    z,
    parent
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    parent.add(
        mesh
    );

    return mesh;
}


/* =====================================================
   ROAD PIECE
===================================================== */

function createRoadPiece(
    z
){

    const group =
    new THREE.Group();

    group.position.z=z;

    world.add(
        group
    );


    createBox(
        38,
        .35,
        100,
        roadMaterial,
        0,
        -.18,
        0,
        group
    );


    createBox(
        6,
        .45,
        100,
        sidewalkMaterial,
        -22,
        .04,
        0,
        group
    );


    createBox(
        6,
        .45,
        100,
        sidewalkMaterial,
        22,
        .04,
        0,
        group
    );


    createBox(
        40,
        .05,
        100,
        grassMaterial,
        -45,
        -.02,
        0,
        group
    );


    createBox(
        40,
        .05,
        100,
        grassMaterial,
        45,
        -.02,
        0,
        group
    );


    /* Lane markings */

    const lanePositions=[
        -12,
        0,
        12
    ];


    for(
        const x of lanePositions
    ){

        for(
            let i=0;
            i<7;
            i++
        ){

            createBox(
                .16,
                .035,
                6,
                whiteMaterial,
                x,
                .02,
                -45+i*15,
                group
            );

        }

    }


    return group;

}


const roadPieces=[];


for(
    let i=0;
    i<10;
    i++
){

    roadPieces.push(
        createRoadPiece(
            -i*100
        )
    );

}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingColors=[
    0xa9b5bf,
    0xc9c0b5,
    0x8fa5b2,
    0xb2b6ac,
    0x969ba5,
    0xd0d3d5
];


function createBuilding(){

    const group =
    new THREE.Group();


    const side =
    Math.random()<.5
    ? -1
    : 1;


    const width =
    9+
    Math.random()*17;


    const depth =
    10+
    Math.random()*18;


    const height =
    15+
    Math.random()*55;


    group.position.set(
        side*
        (
            29+
            Math.random()*28
        ),
        height/2,
        -100+
        Math.random()*800
    );


    const buildingMaterial =
    new THREE.MeshStandardMaterial({
        color:
        buildingColors[
            Math.floor(
                Math.random()*
                buildingColors.length
            )
        ],
        roughness:.82
    });


    createBox(
        width,
        height,
        depth,
        buildingMaterial,
        0,
        0,
        0,
        group
    );


    /* Windows */

    const glassMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8bd8f4,
        roughness:.1,
        metalness:.35,
        emissive:0x16485d,
        emissiveIntensity:.15
    });


    const rows =
    Math.floor(
        height/3.5
    );


    const columns =
    Math.floor(
        width/2.5
    );


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<columns;
            c++
        ){

            if(
                Math.random()<.75
            ){

                createBox(
                    .65,
                    .7,
                    .05,
                    glassMaterial,

                    -width/2+
                    1.1+
                    c*2.5,

                    -height/2+
                    2+
                    r*3.4,

                    -depth/2-.04,

                    group
                );

            }

        }

    }


    world.add(
        group
    );


    return group;

}


const buildings=[];


for(
    let i=0;
    i<100;
    i++
){

    buildings.push(
        createBuilding()
    );

}


/* =====================================================
   TREES
===================================================== */

function createTree(){

    const group =
    new THREE.Group();


    const side =
    Math.random()<.5
    ? -1
    : 1;


    group.position.set(
        side*
        (
            24+
            Math.random()*14
        ),
        0,
        -100+
        Math.random()*800
    );


    const trunk =
    new THREE.MeshStandardMaterial({
        color:0x68442b,
        roughness:1
    });


    const leaves =
    new THREE.MeshStandardMaterial({
        color:0x257c37,
        roughness:1
    });


    const trunkMesh =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .3,
            .45,
            3.5,
            10
        ),
        trunk
    );


    trunkMesh.position.y=1.75;

    trunkMesh.castShadow=true;

    group.add(
        trunkMesh
    );


    const crown =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            2,
            14,
            12
        ),
        leaves
    );


    crown.position.y=4;

    crown.castShadow=true;

    group.add(
        crown
    );


    world.add(
        group
    );


    return group;

}


const trees=[];


for(
    let i=0;
    i<55;
    i++
){

    trees.push(
        createTree()
    );

}


/* =====================================================
   GLTF LOADER
===================================================== */

const loader =
new THREE.GLTFLoader();


let carModel=null;

let modelReady=false;


/* =====================================================
   LOAD REALISTIC CAR
===================================================== */

loader.load(

    CAR_MODEL,

    function(gltf){

        carModel =
        gltf.scene;

        carModel.scale.set(
            .012,
            .012,
            .012
        );


        carModel.rotation.y =
        Math.PI;


        carModel.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;

                    object.receiveShadow=true;


                    if(
                        object.material
                    ){

                        object.material.envMapIntensity=1.5;

                    }

                }

            }
        );


        modelReady=true;


        document.getElementById(
            "loadingText"
        ).textContent=
        "Car loaded";


        document.getElementById(
            "barInner"
        ).style.width=
        "100%";


        setTimeout(
            function(){

                document.getElementById(
                    "loading"
                ).style.display="none";

                createPlayer();

                createTraffic();

            },
            400
        );

    },

    function(xhr){

        if(
            xhr.total
        ){

            const percent =
            xhr.loaded /
            xhr.total *
            100;


            document.getElementById(
                "barInner"
            ).style.width=
            percent+"%";

        }

    },

    function(error){

        console.error(
            "Car loading failed:",
            error
        );


        document.getElementById(
            "loadingText"
        ).textContent=
        "Could not load car model.";

    }

);


/* =====================================================
   PLAYER
===================================================== */

let player=null;

let playerReady=false;


function createPlayer(){

    player =
    carModel.clone(true);


    player.position.set(
        0,
        .15,
        45
    );


    player.scale.multiplyScalar(
        1.35
    );


    scene.add(
        player
    );


    playerReady=true;

}


/* =====================================================
   TRAFFIC
===================================================== */

const traffic=[];


const trafficColors=[
    0xffffff,
    0x111111,
    0xff1818,
    0x202b38,
    0x9b9b9b,
    0x0b57a0,
    0xd8d8d8,
    0x252525
];


const lanes=[
    -12,
    0,
    12
];


function createTraffic(){

    for(
        let i=0;
        i<18;
        i++
    ){

        const car =
        carModel.clone(true);


        car.scale.set(
            .011+
            Math.random()*.002,
            .011+
            Math.random()*.002,
            .011+
            Math.random()*.002
        );


        car.position.set(

            lanes[
                Math.floor(
                    Math.random()*
                    lanes.length
                )
            ],

            .1,

            -70-
            i*65-
            Math.random()*80

        );


        car.rotation.y=
        Math.PI;


        /* Random material color */

        car.traverse(
            function(obj){

                if(
                    obj.isMesh &&
                    obj.material
                ){

                    obj.material =
                    obj.material.clone();

                    obj.material.color.setHex(
                        trafficColors[
                            Math.floor(
                                Math.random()*
                                trafficColors.length
                            )
                        ]
                    );

                    obj.material.roughness=.22;

                    obj.material.metalness=.65;

                }

            }
        );


        car.userData.speed =
        18+
        Math.random()*35;


        traffic.push(
            car
        );


        scene.add(
            car
        );

    }

}


/* =====================================================
   INPUT
===================================================== */

const keys={};


window.addEventListener(
    "keydown",
    function(e){

        keys[e.code]=true;


        if(
            e.code==="KeyR"
        ){

            restart();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[e.code]=false;

    }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let speed=0;

let yaw=0;

let nitro=100;

let crashed=false;

let crashTimer=null;


/* =====================================================
   SMOKE
===================================================== */

const smoke=[];


function createSmoke(){

    if(
        !player
    ) return;


    const smokeMaterial =
    new THREE.MeshBasicMaterial({
        color:0xd8d8d8,
        transparent:true,
        opacity:.42,
        depthWrite:false
    });


    const particle =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .16+
            Math.random()*.2,
            8,
            8
        ),
        smokeMaterial
    );


    particle.position.copy(
        player.position
    );


    particle.position.x +=
    Math.random()<.5
    ? -1.4
    : 1.4;


    particle.position.y=.25;

    particle.position.z+=2;


    world.add(
        particle
    );


    smoke.push({
        object:particle,
        life:1
    });

}


/* =====================================================
   COLLISION
===================================================== */

function collisionCheck(){

    if(
        !player ||
        crashed
    ) return;


    for(
        const car of traffic
    ){

        const dx =
        player.position.x -
        car.position.x;


        const dz =
        player.position.z -
        car.position.z;


        const distance =
        Math.sqrt(
            dx*dx+
            dz*dz
        );


        if(
            distance < 4.5
        ){

            crash();

            return;

        }

    }

}


/* =====================================================
   CRASH
===================================================== */

function crash(){

    if(
        crashed
    ) return;


    crashed=true;

    speed=0;


    document.getElementById(
        "crash"
    ).style.opacity=1;


    /* Small camera shake */

    let shake=0;


    const shakeInterval =
    setInterval(
        function(){

            shake++;


            camera.position.x +=
            (Math.random()-.5)*.5;


            camera.position.y +=
            (Math.random()-.5)*.3;


            if(
                shake>15
            ){

                clearInterval(
                    shakeInterval
                );

            }

        },
        25
    );


    crashTimer =
    setTimeout(
        function(){

            document.getElementById(
                "crash"
            ).style.opacity=0;


            restart();

        },
        1000
    );

}


/* =====================================================
   RESTART
===================================================== */

function restart(){

    crashed=false;

    speed=0;

    yaw=0;

    nitro=100;


    if(
        player
    ){

        player.position.set(
            0,
            .15,
            45
        );

        player.rotation.set(
            0,
            Math.PI,
            0
        );

    }


    for(
        let i=0;
        i<traffic.length;
        i++
    ){

        const car =
        traffic[i];


        car.position.z =
        -80-
        i*70-
        Math.random()*100;


        car.position.x =
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ];

    }

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(dt){

    if(
        !player ||
        crashed
    ) return;


    const accelerate =
    keys.KeyW ||
    keys.ArrowUp;


    const brake =
    keys.KeyS ||
    keys.ArrowDown;


    const left =
    keys.KeyA ||
    keys.ArrowLeft;


    const right =
    keys.KeyD ||
    keys.ArrowRight;


    const drifting =
    keys.Space;


    const boosting =
    (
        keys.ShiftLeft ||
        keys.ShiftRight
    ) &&
    nitro>0 &&
    speed>5;


    /* Acceleration */

    if(
        accelerate
    ){

        speed +=
        40*dt;

    }
    else{

        speed -=
        8*dt;

    }


    /* Brake */

    if(
        brake
    ){

        speed -=
        55*dt;

    }


    /* Nitro */

    if(
        boosting
    ){

        speed +=
        70*dt;

        nitro -=
        42*dt;

    }
    else{

        nitro +=
        12*dt;

    }


    speed =
    THREE.MathUtils.clamp(
        speed,
        -15,
        95
    );


    nitro =
    THREE.MathUtils.clamp(
        nitro,
        0,
        100
    );


    /* Steering */

    const steering =
    (right?1:0) -
    (left?1:0);


    /*
       LEFT ARROW = LEFT
       RIGHT ARROW = RIGHT
    */


    yaw +=
    steering *
    (speed/42) *
    (drifting?1.6:1) *
    dt;


    player.rotation.y =
    Math.PI+yaw;


    /* Car body tilt */

    player.rotation.z +=
    (
        -steering*
        (drifting?.12:.06)
        -
        player.rotation.z
    )
    *
    Math.min(
        1,
        dt*7
    );


    /* Movement */

    const forward =
    new THREE.Vector3(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
    );


    player.position.addScaledVector(
        forward,
        -speed*dt
    );


    /* Road boundary */

    player.position.x =
    THREE.MathUtils.clamp(
        player.position.x,
        -14,
        14
    );


    /* Smoke */

    if(
        drifting &&
        Math.abs(speed)>15 &&
        Math.abs(steering)>.1
    ){

        createSmoke();

        createSmoke();

    }


    /* Camera */

    const cameraOffset =
    new THREE.Vector3(
        0,
        4.7,
        11.5
    );


    cameraOffset.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    const target =
    player.position
    .clone()
    .add(
        cameraOffset
    );


    camera.position.lerp(
        target,
        1-
        Math.pow(
            .001,
            dt
        )
    );


    camera.lookAt(
        player.position.x,
        player.position.y+.8,
        player.position.z-3
    );


    camera.fov =
    63+
    Math.min(
        12,
        Math.abs(speed)*.08
    )+
    (boosting?8:0);


    camera.updateProjectionMatrix();


    /* HUD */

    document.getElementById(
        "speed"
    ).innerHTML=
    Math.round(
        Math.abs(speed)*3.6
    )+
    ' <small>KM/H</small>';


    document.getElementById(
        "nitro"
    ).style.width=
    nitro+"%";

}


/* =====================================================
   TRAFFIC UPDATE
===================================================== */

function updateTraffic(dt){

    if(
        crashed
    ) return;


    for(
        const car of traffic
    ){

        car.position.z +=
        car.userData.speed*
        dt;


        if(
            car.position.z >
            player.position.z+70
        ){

            car.position.z =
            player.position.z-
            850-
            Math.random()*350;


            car.position.x =
            lanes[
                Math.floor(
                    Math.random()*
                    lanes.length
                )
            ];


            car.userData.speed =
            20+
            Math.random()*40;

        }

    }

}


/* =====================================================
   ENDLESS WORLD
===================================================== */

function updateWorld(){

    if(
        !player
    ) return;


    /* Roads */

    for(
        const road of roadPieces
    ){

        if(
            road.position.z >
            player.position.z+120
        ){

            road.position.z-=1000;

        }


        if(
            road.position.z <
            player.position.z-850
        ){

            road.position.z+=1000;

        }

    }


    /* Buildings */

    for(
        const building of buildings
    ){

        if(
            building.position.z >
            player.position.z+180
        ){

            building.position.z-=850;

        }


        if(
            building.position.z <
            player.position.z-700
        ){

            building.position.z+=850;

        }

    }


    /* Trees */

    for(
        const tree of trees
    ){

        if(
            tree.position.z >
            player.position.z+180
        ){

            tree.position.z-=850;

        }


        if(
            tree.position.z <
            player.position.z-700
        ){

            tree.position.z+=850;

        }

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function updateParticles(dt){

    for(
        let i=smoke.length-1;
        i>=0;
        i--
    ){

        const particle =
        smoke[i];


        particle.life-=dt;


        particle.object.position.y +=
        dt*.8;


        particle.object.scale.multiplyScalar(
            1+dt*1.7
        );


        particle.object.material.opacity =
        .42*
        particle.life;


        if(
            particle.life<=0
        ){

            world.remove(
                particle.object
            );


            smoke.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   MAIN LOOP
===================================================== */

let previous =
performance.now();


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt =
    Math.min(
        (time-previous)/1000,
        .035
    );


    previous=time;


    updatePlayer(dt);

    updateTraffic(dt);

    updateWorld();

    collisionCheck();

    updateParticles(dt);


    renderer.render(
        scene,
        camera
    );

}


animate(
    performance.now()
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
