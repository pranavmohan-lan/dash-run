<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Racer V2</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8fd7ff;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px #234;
}

#title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-weight:900;
    letter-spacing:4px;
}

#speed{
    position:absolute;
    left:22px;
    bottom:25px;
    font-size:28px;
    font-weight:900;
}

#nitrobox{
    position:absolute;
    left:22px;
    bottom:68px;
    width:190px;
    height:13px;
    border:2px solid white;
    border-radius:10px;
    background:#0005;
    overflow:hidden;
}

#nitro{
    height:100%;
    width:100%;
    background:#26a9ff;
}

#help{
    position:absolute;
    right:18px;
    bottom:18px;
    text-align:right;
    font-size:13px;
    line-height:1.5;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">CITY RACER • V2</div>

    <div id="speed">0 km/h</div>

    <div id="nitrobox">
        <div id="nitro"></div>
    </div>

    <div id="help">
        WASD / ARROWS — Drive<br>
        SPACE — Drift<br>
        SHIFT — Nitro<br>
        R — Reset
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fd7ff);

scene.fog = new THREE.Fog(
    0x8fd7ff,
    100,
    360
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    68,
    innerWidth / innerHeight,
    0.1,
    600
);

camera.position.set(0,5,12);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* =========================
   LIGHTING
========================= */

const skyLight =
    new THREE.HemisphereLight(
        0xccefff,
        0x68755e,
        2.2
    );

scene.add(skyLight);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );

sun.position.set(
    -70,
    120,
    -80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -130;
sun.shadow.camera.right = 130;
sun.shadow.camera.top = 130;
sun.shadow.camera.bottom = -130;

scene.add(sun);


/* =========================
   WORLD
========================= */

const world = new THREE.Group();

scene.add(world);


/* =========================
   MATERIALS
========================= */

const roadMat =
    new THREE.MeshStandardMaterial({
        color:0x30343a,
        roughness:.95
    });

const sidewalkMat =
    new THREE.MeshStandardMaterial({
        color:0xb8b8b0,
        roughness:.9
    });

const grassMat =
    new THREE.MeshStandardMaterial({
        color:0x65a85a,
        roughness:1
    });

const lineMat =
    new THREE.MeshStandardMaterial({
        color:0xf6f1c9,
        roughness:.7
    });


const buildingMats = [

    new THREE.MeshStandardMaterial({
        color:0xd5d9dc,
        roughness:.85
    }),

    new THREE.MeshStandardMaterial({
        color:0xa9bac8,
        roughness:.85
    }),

    new THREE.MeshStandardMaterial({
        color:0xcbbcae,
        roughness:.9
    }),

    new THREE.MeshStandardMaterial({
        color:0x9fb0a0,
        roughness:.9
    })

];


/* =========================
   BOX HELPER
========================= */

function box(
    w,
    h,
    d,
    material,
    x,
    y,
    z,
    parent = world
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


/* =========================
   ENDLESS ROAD
========================= */

function createRoadPiece(z){

    const group =
        new THREE.Group();

    group.position.z = z;

    world.add(group);


    /* Main road */

    box(
        34,
        .3,
        100,
        roadMat,
        0,
        -.15,
        0,
        group
    );


    /* Sidewalks */

    box(
        6,
        .45,
        100,
        sidewalkMat,
        -20,
        .05,
        0,
        group
    );

    box(
        6,
        .45,
        100,
        sidewalkMat,
        20,
        .05,
        0,
        group
    );


    /* Grass */

    box(
        30,
        .08,
        100,
        grassMat,
        -38,
        0,
        0,
        group
    );

    box(
        30,
        .08,
        100,
        grassMat,
        38,
        0,
        0,
        group
    );


    /* Road markings */

    for(
        let x=-12;
        x<=12;
        x+=12
    ){

        for(
            let i=0;
            i<7;
            i++
        ){

            box(
                .18,
                .035,
                7,
                lineMat,
                x,
                .02,
                -45+i*15,
                group
            );

        }

    }

    return group;
}


const roadPieces = [];

for(
    let i=0;
    i<8;
    i++
){

    roadPieces.push(
        createRoadPiece(
            -i*100
        )
    );

}


/* =========================
   BUILDINGS
========================= */

function createBuilding(){

    const side =
        Math.random()<.5
        ? -1
        : 1;

    const x =
        side *
        (27 + Math.random()*23);

    const z =
        -80 +
        Math.random()*500;

    const width =
        7 +
        Math.random()*12;

    const depth =
        8 +
        Math.random()*12;

    const height =
        12 +
        Math.random()*38;


    const group =
        new THREE.Group();

    group.position.set(
        x,
        height/2,
        z
    );

    world.add(group);


    box(
        width,
        height,
        depth,
        buildingMats[
            Math.floor(
                Math.random() *
                buildingMats.length
            )
        ],
        0,
        0,
        0,
        group
    );


    /* Windows */

    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0x8bd3ee,
            emissive:0x397b9a,
            emissiveIntensity:.18
        });


    for(
        let row=0;
        row<Math.floor(height/3.5);
        row++
    ){

        for(
            let col=0;
            col<Math.floor(width/2.7);
            col++
        ){

            if(
                Math.random()<.7
            ){

                box(
                    .7,
                    .65,
                    .06,
                    windowMat,

                    -width/2 +
                    1.2 +
                    col*2.4,

                    -height/2 +
                    2 +
                    row*3.2,

                    -depth/2-.04,

                    group
                );

            }

        }

    }

    return group;
}


const buildings=[];

for(
    let i=0;
    i<70;
    i++
){

    buildings.push(
        createBuilding()
    );

}


/* =========================
   PLAYER CAR
========================= */

function createCar(color){

    const group =
        new THREE.Group();


    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.3,
            metalness:.5
        });


    const darkMat =
        new THREE.MeshStandardMaterial({
            color:0x101319,
            roughness:.25,
            metalness:.7
        });


    const glassMat =
        new THREE.MeshStandardMaterial({
            color:0x122536,
            roughness:.08,
            metalness:.4
        });


    /* Body */

    box(
        3.4,
        .75,
        6.2,
        bodyMat,
        0,
        .7,
        0,
        group
    );


    /* Cabin */

    box(
        2.85,
        1,
        2.9,
        glassMat,
        0,
        1.35,
        .3,
        group
    );


    /* Roof */

    box(
        2.95,
        .18,
        3,
        bodyMat,
        0,
        1.88,
        .3,
        group
    );


    /* Wheels */

    for(
        const x of [-1.75,1.75]
    ){

        for(
            const z of [-2.05,2.05]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .5,
                        .5,
                        .38,
                        18
                    ),
                    darkMat
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                x,
                .45,
                z
            );

            wheel.castShadow = true;

            group.add(wheel);

        }

    }


    return group;
}


const player =
    createCar(0x1976ff);

scene.add(player);

player.position.set(
    0,
    .45,
    45
);


/* =========================
   TRAFFIC
========================= */

const traffic=[];

const trafficColors=[
    0xe53935,
    0xffc107,
    0x26a69a,
    0x7e57c2,
    0xf5f5f5,
    0x20252b,
    0xff7043
];


for(
    let i=0;
    i<18;
    i++
){

    const car =
        createCar(
            trafficColors[
                i %
                trafficColors.length
            ]
        );


    car.scale.setScalar(
        .82 +
        Math.random()*.15
    );


    const lanes=[
        -10,
        -4,
        4,
        10
    ];


    car.position.set(
        lanes[
            Math.floor(
                Math.random()*lanes.length
            )
        ],
        .45,
        -40 -
        i*38 -
        Math.random()*30
    );


    car.userData.speed =
        18 +
        Math.random()*28;


    traffic.push(car);

    scene.add(car);
}


/* =========================
   CONTROLS
========================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="KeyR"
        ){

            reset();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[e.code]=false;

    }
);


/* =========================
   GAME VARIABLES
========================= */

let speed=0;

let yaw=0;

let nitro=100;


/* =========================
   SMOKE
========================= */

const smoke=[];


function createSmoke(){

    const material =
        new THREE.MeshBasicMaterial({
            color:0xd9dde0,
            transparent:true,
            opacity:.38,
            depthWrite:false
        });


    const particle =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .18 +
                Math.random()*.16,
                8,
                8
            ),
            material
        );


    particle.position.copy(
        player.position
    );


    particle.position.x +=
        Math.random()<.5
        ? -1.4
        : 1.4;


    particle.position.y=.35;

    particle.position.z+=2.5;


    world.add(particle);


    smoke.push({
        particle:particle,
        life:1
    });

}


/* =========================
   RESET
========================= */

function reset(){

    player.position.set(
        0,
        .45,
        45
    );

    speed=0;

    yaw=0;

    nitro=100;

}


/* =========================
   GAME LOOP
========================= */

let last =
    performance.now();


function gameLoop(now){

    requestAnimationFrame(
        gameLoop
    );


    const dt =
        Math.min(
            (now-last)/1000,
            .035
        );


    last=now;


    /* Controls */

    const accelerate =
        keys.KeyW ||
        keys.ArrowUp;


    const brake =
        keys.KeyS ||
        keys.ArrowDown;


    const left =
        keys.KeyA ||
        keys.ArrowLeft;


    const right =
        keys.KeyD ||
        keys.ArrowRight;


    const drifting =
        keys.Space;


    const boosting =
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        ) &&
        nitro>0 &&
        speed>5;


    /* Acceleration */

    if(
        accelerate
    ){

        speed +=
            35*dt;

    }else{

        speed -=
            8*dt;

    }


    /* Brake */

    if(
        brake
    ){

        speed -=
            50*dt;

    }


    /* Nitro */

    if(
        boosting
    ){

        speed +=
            55*dt;

        nitro -=
            35*dt;

    }else{

        nitro +=
            13*dt;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            -12,
            78
        );


    nitro =
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


    /* Steering */

    const steering =
        (right?1:0) -
        (left?1:0);


    yaw +=
        steering *
        (speed/45) *
        (drifting?1.55:1) *
        dt;


    player.rotation.y =
        yaw;


    player.rotation.z +=
        (
            -steering *
            (drifting?.15:.08)
            -
            player.rotation.z
        ) *
        Math.min(
            1,
            dt*7
        );


    /* Move car */

    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    player.position.addScaledVector(
        forward,
        -speed*dt
    );


    /* Road boundaries */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -13,
            13
        );


    /* Smoke */

    if(
        drifting &&
        Math.abs(speed)>12 &&
        Math.abs(steering)>.1
    ){

        createSmoke();
        createSmoke();

    }


    /* =====================
       ENDLESS ROAD
    ===================== */

    for(
        const piece of roadPieces
    ){

        if(
            piece.position.z >
            player.position.z+100
        ){

            piece.position.z -=
                800;

        }


        if(
            piece.position.z <
            player.position.z-800
        ){

            piece.position.z +=
                800;

        }

    }


    /* =====================
       ENDLESS BUILDINGS
    ===================== */

    for(
        const building of buildings
    ){

        if(
            building.position.z >
            player.position.z+130
        ){

            building.position.z -=
                650;

        }


        if(
            building.position.z <
            player.position.z-520
        ){

            building.position.z +=
                650;

        }

    }


    /* =====================
       MOVING TRAFFIC
    ===================== */

    for(
        const car of traffic
    ){

        car.position.z +=
            car.userData.speed *
            dt;


        if(
            car.position.z >
            player.position.z+45
        ){

            car.position.z =
                player.position.z -
                650 -
                Math.random()*350;


            const lanes=[
                -10,
                -4,
                4,
                10
            ];


            car.position.x =
                lanes[
                    Math.floor(
                        Math.random() *
                        lanes.length
                    )
                ];


            car.userData.speed =
                18 +
                Math.random()*28;

        }

    }


    /* =====================
       CAMERA
    ===================== */

    const cameraOffset =
        new THREE.Vector3(
            0,
            5,
            11.5
        );


    cameraOffset.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    const desiredCamera =
        player.position.clone()
        .add(cameraOffset);


    camera.position.lerp(
        desiredCamera,
        1 -
        Math.pow(
            .002,
            dt
        )
    );


    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z-2
    );


    /* Speed FOV */

    camera.fov =
        68 +
        (boosting?8:0) +
        Math.min(
            8,
            Math.abs(speed)*.07
        );


    camera.updateProjectionMatrix();


    /* =====================
       SMOKE UPDATE
    ===================== */

    for(
        let i=smoke.length-1;
        i>=0;
        i--
    ){

        const p =
            smoke[i];


        p.life -=
            dt;


        p.particle.position.y +=
            dt*.8;


        p.particle.scale.multiplyScalar(
            1+dt*1.8
        );


        p.particle.material.opacity =
            .38*p.life;


        if(
            p.life<=0
        ){

            world.remove(
                p.particle
            );

            smoke.splice(
                i,
                1
            );

        }

    }


    /* HUD */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed)*3.6
        ) +
        " km/h";


    document.getElementById(
        "nitro"
    ).style.width =
        nitro+"%";


    renderer.render(
        scene,
        camera
    );

}


reset();

gameLoop(
    performance.now()
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
