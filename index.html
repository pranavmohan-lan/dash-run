<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>City Racer V3</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px rgba(0,0,0,.8);
}

#title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:900;
    letter-spacing:5px;
}

#speed{
    position:absolute;
    left:25px;
    bottom:30px;
    font-size:32px;
    font-weight:900;
}

#nitroContainer{
    position:absolute;
    left:25px;
    bottom:82px;
    width:230px;
    height:16px;
    border:2px solid white;
    border-radius:12px;
    background:rgba(0,0,0,.45);
    overflow:hidden;
}

#nitro{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #00bfff,
        #008cff,
        #7b00ff
    );
    box-shadow:0 0 15px #00bfff;
}

#nitroText{
    position:absolute;
    left:25px;
    bottom:103px;
    font-size:11px;
    font-weight:bold;
}

#controls{
    position:absolute;
    right:22px;
    bottom:22px;
    text-align:right;
    line-height:1.7;
    font-size:13px;
}

#crash{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(150,0,0,.3);
    opacity:0;
    transition:opacity .15s;
}

#crash h1{
    margin:0;
    font-size:64px;
    color:white;
    text-shadow:0 4px 20px black;
}

#crash p{
    font-size:18px;
}

#start{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        #5eb9e8,
        #d9f3ff
    );
    z-index:10;
}

#startBox{
    text-align:center;
    color:white;
    background:rgba(0,0,0,.48);
    padding:35px 50px;
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

#startBox h1{
    font-size:42px;
    margin:0 0 10px;
}

#startBox p{
    opacity:.9;
}

#startButton{
    margin-top:20px;
    padding:14px 35px;
    border:0;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="start">
    <div id="startBox">
        <h1>CITY RACER</h1>
        <p>Daytime Endless Highway</p>
        <p>Luxury Cars • Traffic • Nitro • Drift</p>
        <button id="startButton">START RACE</button>
    </div>
</div>

<div id="hud">

    <div id="title">
        CITY RACER
    </div>

    <div id="speed">
        0 km/h
    </div>

    <div id="nitroText">
        NITRO
    </div>

    <div id="nitroContainer">
        <div id="nitro"></div>
    </div>

    <div id="controls">
        ↑ / W — Accelerate<br>
        ↓ / S — Brake<br>
        ← / A — LEFT<br>
        → / D — RIGHT<br>
        SPACE — Drift<br>
        SHIFT — Nitro<br>
        R — Restart
    </div>

</div>

<div id="crash">
    <h1>CRASH!</h1>
    <p>Restarting...</p>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas =
    document.getElementById("game");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8fd8ff);

scene.fog =
    new THREE.Fog(
        0x8fd8ff,
        110,
        420
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        .1,
        700
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.25;


/* =========================================================
   LIGHTING
========================================================= */

const skyLight =
    new THREE.HemisphereLight(
        0xd8f4ff,
        0x68735c,
        2.4
    );

scene.add(skyLight);


const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

sunlight.position.set(
    -100,
    150,
    -100
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.left=-150;
sunlight.shadow.camera.right=150;
sunlight.shadow.camera.top=150;
sunlight.shadow.camera.bottom=-150;

scene.add(sunlight);


/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);


/* =========================================================
   MATERIAL HELPER
========================================================= */

function material(
    color,
    roughness=.6,
    metalness=.1
){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:roughness,
        metalness:metalness
    });

}


/* =========================================================
   BOX HELPER
========================================================= */

function box(
    width,
    height,
    depth,
    mat,
    x,
    y,
    z,
    parent
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            mat
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;
}


/* =========================================================
   ROAD
========================================================= */

const roadMaterial =
    material(
        0x292d32,
        .95,
        0
    );

const sidewalkMaterial =
    material(
        0xa7aaa7,
        .9,
        0
    );

const grassMaterial =
    material(
        0x5ca653,
        1,
        0
    );

const lineMaterial =
    material(
        0xffffff,
        .6,
        0
    );


function createRoadPiece(z){

    const group =
        new THREE.Group();

    group.position.z=z;

    world.add(group);


    /* Main highway */

    box(
        36,
        .3,
        100,
        roadMaterial,
        0,
        -.15,
        0,
        group
    );


    /* Sidewalks */

    box(
        6,
        .5,
        100,
        sidewalkMaterial,
        -21,
        .05,
        0,
        group
    );

    box(
        6,
        .5,
        100,
        sidewalkMaterial,
        21,
        .05,
        0,
        group
    );


    /* Grass */

    box(
        35,
        .05,
        100,
        grassMaterial,
        -42,
        -.02,
        0,
        group
    );

    box(
        35,
        .05,
        100,
        grassMaterial,
        42,
        -.02,
        0,
        group
    );


    /* Lane markings */

    const lanes=[
        -12,
        0,
        12
    ];

    for(
        const x of lanes
    ){

        for(
            let i=0;
            i<7;
            i++
        ){

            box(
                .18,
                .035,
                6,
                lineMaterial,
                x,
                .02,
                -45+i*15,
                group
            );

        }

    }

    return group;
}


const roadPieces=[];

for(
    let i=0;
    i<9;
    i++
){

    roadPieces.push(
        createRoadPiece(
            -i*100
        )
    );

}


/* =========================================================
   BUILDINGS
========================================================= */

const buildingMaterials=[

    material(
        0xb7c1ca,
        .85
    ),

    material(
        0xd1c5b5,
        .85
    ),

    material(
        0x8fa5b2,
        .85
    ),

    material(
        0xb3b7aa,
        .9
    ),

    material(
        0x9b9fa8,
        .85
    )

];


function createBuilding(){

    const side =
        Math.random()<.5
        ? -1
        : 1;

    const width =
        8 +
        Math.random()*13;

    const depth =
        10 +
        Math.random()*16;

    const height =
        12 +
        Math.random()*45;

    const x =
        side *
        (
            28 +
            Math.random()*25
        );

    const z =
        -120 +
        Math.random()*700;


    const group =
        new THREE.Group();

    group.position.set(
        x,
        height/2,
        z
    );

    world.add(group);


    box(
        width,
        height,
        depth,
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ],
        0,
        0,
        0,
        group
    );


    const windowMaterial =
        new THREE.MeshStandardMaterial({
            color:0x9fe4ff,
            emissive:0x4287a0,
            emissiveIntensity:.18
        });


    const rows =
        Math.floor(
            height/3.5
        );

    const cols =
        Math.floor(
            width/2.5
        );


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            if(
                Math.random()<.7
            ){

                box(
                    .65,
                    .75,
                    .05,
                    windowMaterial,

                    -width/2+
                    1+
                    c*2.3,

                    -height/2+
                    2+
                    r*3.3,

                    -depth/2-.04,

                    group
                );

            }

        }

    }

    return group;
}


const buildings=[];

for(
    let i=0;
    i<90;
    i++
){

    buildings.push(
        createBuilding()
    );

}


/* =========================================================
   TREES
========================================================= */

function createTree(){

    const group =
        new THREE.Group();

    const side =
        Math.random()<.5
        ? -1
        : 1;

    group.position.set(
        side*
        (
            24+
            Math.random()*12
        ),
        0,
        -100+
        Math.random()*700
    );

    const trunk =
        material(
            0x68452b,
            1
        );

    const leaves =
        material(
            0x247c36,
            .9
        );


    const trunkMesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .4,
                3,
                10
            ),
            trunk
        );

    trunkMesh.position.y=1.5;

    group.add(trunkMesh);


    const crown =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7,
                12,
                10
            ),
            leaves
        );

    crown.position.y=3.7;

    crown.castShadow=true;

    group.add(crown);

    world.add(group);

    return group;
}


const trees=[];

for(
    let i=0;
    i<45;
    i++
){

    trees.push(
        createTree()
    );

}


/* =========================================================
   CAR FACTORY
========================================================= */

function createDetailedCar(
    type,
    color
){

    const car =
        new THREE.Group();


    let bodyColor =
        color;


    const body =
        material(
            bodyColor,
            .25,
            .65
        );


    const dark =
        material(
            0x090b0f,
            .2,
            .8
        );


    const glass =
        new THREE.MeshStandardMaterial({
            color:0x101e2a,
            roughness:.06,
            metalness:.6
        });


    const chrome =
        material(
            0xcfd6dc,
            .15,
            .9
        );


    const light =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffff,
            emissiveIntensity:1.5
        });


    const redLight =
        new THREE.MeshStandardMaterial({
            color:0xff1010,
            emissive:0xff0000,
            emissiveIntensity:1
        });


    /* =================
       BODY STYLE
    ================= */

    let bodyWidth=3.6;
    let bodyHeight=.7;
    let bodyLength=6.4;

    if(type==="luxury"){

        bodyWidth=3.7;
        bodyHeight=.78;
        bodyLength=7;

    }

    if(type==="hyper"){

        bodyWidth=3.8;
        bodyHeight=.62;
        bodyLength=6.6;

    }

    if(type==="super"){

        bodyWidth=3.65;
        bodyHeight=.58;
        bodyLength=6.2;

    }


    box(
        bodyWidth,
        bodyHeight,
        bodyLength,
        body,
        0,
        .7,
        0,
        car
    );


    /* =================
       HOOD
    ================= */

    box(
        bodyWidth-.25,
        .28,
        2.15,
        body,
        0,
        1.02,
        -2.15,
        car
    );


    /* =================
       CABIN
    ================= */

    let cabinWidth =
        bodyWidth-.55;

    let cabinLength=3.1;


    if(type==="luxury"){

        cabinLength=3.5;

    }

    if(type==="hyper"){

        cabinLength=2.7;

    }


    box(
        cabinWidth,
        1.05,
        cabinLength,
        glass,
        0,
        1.34,
        .35,
        car
    );


    /* =================
       ROOF
    ================= */

    box(
        cabinWidth+.05,
        .14,
        cabinLength+.05,
        body,
        0,
        1.91,
        .35,
        car
    );


    /* =================
       FRONT SPLITTER
    ================= */

    if(
        type==="hyper" ||
        type==="super"
    ){

        box(
            bodyWidth+.2,
            .08,
            .35,
            dark,
            0,
            .42,
            -3.3,
            car
        );

    }


    /* =================
       REAR SPOILER
    ================= */

    if(
        type==="hyper" ||
        type==="super"
    ){

        box(
            2.8,
            .12,
            .18,
            dark,
            0,
            1.65,
            2.8,
            car
        );

        box(
            .12,
            .55,
            .15,
            dark,
            -1.15,
            1.35,
            2.8,
            car
        );

        box(
            .12,
            .55,
            .15,
            dark,
            1.15,
            1.35,
            2.8,
            car
        );

    }


    /* =================
       WHEELS
    ================= */

    for(
        const x of [
            -bodyWidth/2-.05,
            bodyWidth/2+.05
        ]
    ){

        for(
            const z of [
                -2.05,
                2.05
            ]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .53,
                        .53,
                        .38,
                        24
                    ),
                    dark
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                x,
                .47,
                z
            );

            wheel.castShadow=true;

            car.add(wheel);


            const rim =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .25,
                        .25,
                        .4,
                        16
                    ),
                    chrome
                );

            rim.rotation.z=
                Math.PI/2;

            rim.position.copy(
                wheel.position
            );

            car.add(rim);

        }

    }


    /* =================
       HEADLIGHTS
    ================= */

    for(
        const x of [-1.05,1.05]
    ){

        box(
            .65,
            .2,
            .08,
            light,
            x,
            .9,
            -3.25,
            car
        );

    }


    /* =================
       TAIL LIGHTS
    ================= */

    for(
        const x of [-1.05,1.05]
    ){

        box(
            .7,
            .2,
            .08,
            redLight,
            x,
            .88,
            3.25,
            car
        );

    }


    /* =================
       FRONT GRILLE
    ================= */

    if(
        type==="luxury"
    ){

        box(
            1.45,
            .42,
            .06,
            dark,
            0,
            .7,
            -3.27,
            car
        );

        box(
            .08,
            .5,
            .08,
            chrome,
            0,
            .7,
            -3.32,
            car
        );

    }


    car.userData.type=type;

    return car;
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    createDetailedCar(
        "hyper",
        0x176cff
    );

scene.add(player);

player.position.set(
    0,
    .45,
    50
);


/* =========================================================
   TRAFFIC
========================================================= */

const traffic=[];


const trafficTypes=[
    {
        type:"luxury",
        color:0x101216
    },
    {
        type:"luxury",
        color:0xffffff
    },
    {
        type:"super",
        color:0xff2222
    },
    {
        type:"super",
        color:0xffc400
    },
    {
        type:"hyper",
        color:0x111111
    },
    {
        type:"hyper",
        color:0x20a0ff
    },
    {
        type:"luxury",
        color:0x777777
    }
];


const lanes=[
    -12,
    0,
    12
];


for(
    let i=0;
    i<20;
    i++
){

    const info =
        trafficTypes[
            Math.floor(
                Math.random() *
                trafficTypes.length
            )
        ];


    const car =
        createDetailedCar(
            info.type,
            info.color
        );


    car.scale.setScalar(
        .85+
        Math.random()*.12
    );


    car.position.set(
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ],
        .45,
        -50-
        i*55-
        Math.random()*40
    );


    car.userData.speed =
        20+
        Math.random()*35;


    traffic.push(car);

    scene.add(car);

}


/* =========================================================
   CONTROLS
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    function(event){

        keys[event.code]=true;

        if(
            event.code==="KeyR"
        ){

            restart();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        keys[event.code]=false;

    }
);


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

const smoke=[];


function createSmoke(){

    const mat =
        new THREE.MeshBasicMaterial({
            color:0xd7d7d7,
            transparent:true,
            opacity:.42,
            depthWrite:false
        });


    const particle =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .18+
                Math.random()*.18,
                8,
                8
            ),
            mat
        );


    particle.position.copy(
        player.position
    );


    particle.position.x +=
        Math.random()<.5
        ? -1.4
        : 1.4;


    particle.position.y=.4;

    particle.position.z+=2.5;

    world.add(
        particle
    );


    smoke.push({
        object:particle,
        life:1
    });

}


/* =========================================================
   CRASH EFFECT
========================================================= */

const crashParticles=[];


function crashEffect(){

    for(
        let i=0;
        i<45;
        i++
    ){

        const mat =
            new THREE.MeshBasicMaterial({
                color:
                    Math.random()<.5
                    ? 0xffa000
                    : 0xffffff
            });


        const particle =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .06+
                    Math.random()*.12,
                    8,
                    8
                ),
                mat
            );


        particle.position.copy(
            player.position
        );


        particle.position.x +=
            (Math.random()-.5)*3;

        particle.position.y +=
            Math.random()*2;

        particle.position.z +=
            (Math.random()-.5)*4;


        world.add(
            particle
        );


        crashParticles.push({
            object:particle,
            velocity:new THREE.Vector3(
                (Math.random()-.5)*12,
                Math.random()*10,
                (Math.random()-.5)*12
            ),
            life:1
        });

    }

}


/* =========================================================
   COLLISION
========================================================= */

let crashed=false;


function checkCollision(){

    if(crashed)return;


    for(
        const car of traffic
    ){

        const dx =
            player.position.x -
            car.position.x;

        const dz =
            player.position.z -
            car.position.z;


        const distance =
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        if(
            distance<4.2
        ){

            crashed=true;

            crashEffect();

            document.getElementById(
                "crash"
            ).style.opacity=1;


            setTimeout(
                ()=>{
                    document.getElementById(
                        "crash"
                    ).style.opacity=0;

                    restart();

                },
                1000
            );

            break;

        }

    }

}


/* =========================================================
   RESTART
========================================================= */

function restart(){

    crashed=false;

    player.position.set(
        0,
        .45,
        50
    );

    player.rotation.set(
        0,
        0,
        0
    );

    speed=0;

    yaw=0;

    nitro=100;


    for(
        let i=0;
        i<traffic.length;
        i++
    ){

        traffic[i].position.z =
            -70-
            i*65-
            Math.random()*80;

        traffic[i].position.x =
            lanes[
                Math.floor(
                    Math.random()*
                    lanes.length
                )
            ];

    }

}


/* =========================================================
   GAME VARIABLES
========================================================= */

let speed=0;

let yaw=0;

let nitro=100;


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            (time-lastTime)/1000,
            .035
        );


    lastTime=time;


    if(!crashed){

        updatePlayer(dt);

        updateTraffic(dt);

        updateWorld();

        checkCollision();

    }


    updateParticles(dt);

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    const accelerate =
        keys.KeyW ||
        keys.ArrowUp;


    const brake =
        keys.KeyS ||
        keys.ArrowDown;


    const left =
        keys.KeyA ||
        keys.ArrowLeft;


    const right =
        keys.KeyD ||
        keys.ArrowRight;


    const drift =
        keys.Space;


    const boost =
        (
            keys.ShiftLeft ||
            keys.ShiftRight
        ) &&
        nitro>0 &&
        speed>5;


    /* Acceleration */

    if(
        accelerate
    ){

        speed +=
            38*dt;

    }else{

        speed -=
            9*dt;

    }


    /* Brake */

    if(
        brake
    ){

        speed -=
            55*dt;

    }


    /* Nitro */

    if(
        boost
    ){

        speed +=
            65*dt;

        nitro -=
            40*dt;

    }else{

        nitro +=
            12*dt;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            -15,
            90
        );


    nitro =
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


    /* Steering */

    const steering =
        (right?1:0) -
        (left?1:0);


    /*
       RIGHT ARROW = RIGHT
       LEFT ARROW = LEFT
    */

    const steeringPower =
        drift
        ? 1.65
        : 1;


    yaw +=
        steering *
        steeringPower *
        (speed/45) *
        dt;


    player.rotation.y=
        yaw;


    /* Car body lean */

    player.rotation.z +=
        (
            -steering*
            (drift?.18:.09)
            -
            player.rotation.z
        ) *
        Math.min(
            1,
            dt*8
        );


    /* Movement */

    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    player.position.addScaledVector(
        forward,
        -speed*dt
    );


    /* Keep on road */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -14,
            14
        );


    /* Smoke */

    if(
        drift &&
        Math.abs(speed)>15 &&
        Math.abs(steering)>.1
    ){

        createSmoke();

        createSmoke();

    }


    /* Camera */

    const cameraOffset =
        new THREE.Vector3(
            0,
            5.3,
            12
        );


    cameraOffset.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    const targetCamera =
        player.position.clone()
        .add(cameraOffset);


    camera.position.lerp(
        targetCamera,
        1-
        Math.pow(
            .0015,
            dt
        )
    );


    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z-3
    );


    /* Speed FOV */

    camera.fov =
        65+
        Math.min(
            12,
            Math.abs(speed)*.08
        )+
        (boost?7:0);


    camera.updateProjectionMatrix();


    /* HUD */

    document.getElementById(
        "speed"
    ).textContent=
        Math.round(
            Math.abs(speed)*3.6
        )+
        " km/h";


    document.getElementById(
        "nitro"
    ).style.width=
        nitro+"%";

}


/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

    for(
        const car of traffic
    ){

        car.position.z +=
            car.userData.speed*
            dt;


        if(
            car.position.z >
            player.position.z+65
        ){

            car.position.z =
                player.position.z-
                750-
                Math.random()*350;


            car.position.x =
                lanes[
                    Math.floor(
                        Math.random()*
                        lanes.length
                    )
                ];


            car.userData.speed =
                18+
                Math.random()*40;

        }

    }

}


/* =========================================================
   ENDLESS WORLD
========================================================= */

function updateWorld(){

    /* Roads */

    for(
        const road of roadPieces
    ){

        if(
            road.position.z >
            player.position.z+110
        ){

            road.position.z-=900;

        }


        if(
            road.position.z <
            player.position.z-800
        ){

            road.position.z+=900;

        }

    }


    /* Buildings */

    for(
        const building of buildings
    ){

        if(
            building.position.z >
            player.position.z+160
        ){

            building.position.z-=750;

        }


        if(
            building.position.z <
            player.position.z-650
        ){

            building.position.z+=750;

        }

    }


    /* Trees */

    for(
        const tree of trees
    ){

        if(
            tree.position.z >
            player.position.z+160
        ){

            tree.position.z-=750;

        }


        if(
            tree.position.z <
            player.position.z-650
        ){

            tree.position.z+=750;

        }

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(dt){

    for(
        let i=smoke.length-1;
        i>=0;
        i--
    ){

        const p=
            smoke[i];


        p.life-=dt;


        p.object.position.y +=
            dt*.9;


        p.object.scale.multiplyScalar(
            1+dt*1.8
        );


        p.object.material.opacity =
            .42*p.life;


        if(
            p.life<=0
        ){

            world.remove(
                p.object
            );

            smoke.splice(
                i,
                1
            );

        }

    }


    for(
        let i=crashParticles.length-1;
        i>=0;
        i--
    ){

        const p=
            crashParticles[i];


        p.life-=dt;


        p.velocity.y -=
            12*dt;


        p.object.position.addScaledVector(
            p.velocity,
            dt
        );


        if(
            p.life<=0
        ){

            world.remove(
                p.object
            );

            crashParticles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "start"
        ).style.display="none";

        restart();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   START
========================================================= */

restart();

animate(
    performance.now()
);

</script>
